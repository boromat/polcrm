# PolCRM + PostgreSQL. Przed startem: cp .env.example .env, uzupełnij sekrety i POSTGRES_PASSWORD.
#   docker compose up -d --build
# Aplikacja słucha tylko na 127.0.0.1:4666 - do internetu wystaw ją przez Cloudflare Tunnel
# albo reverse proxy z HTTPS (zob. docs/DEPLOY.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polcrm
      POSTGRES_USER: polcrm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U polcrm -d polcrm"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://polcrm:${POSTGRES_PASSWORD}@db:5432/polcrm
      APP_HOST: 0.0.0.0
    ports:
      - "127.0.0.1:4666:4666"
    volumes:
      - instance:/app/instance
      - output:/app/output
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  instance:
  output:
