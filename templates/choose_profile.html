<!DOCTYPE html>
<html lang="{{ lang }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a14">
    <title>{{ _('Kim jesteś?') }} - PolCRM</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" integrity="sha384-XGjxtQfXaH2tnPFa9x+ruJTuLE3Aa6LhHSWRr1XeTyhezb4abCG4ccI5AkVDxqC+" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .picker-wrap {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }
        .picker-inner {
            text-align: center;
            width: 100%;
            max-width: 720px;
        }
        .picker-logo {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }
        .picker-logo .logo {
            width: 44px; height: 44px; border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-light));
            display: grid; place-items: center;
            color: white; font-weight: 800; font-size: 20px;
            box-shadow: 0 8px 24px rgba(108, 92, 231, 0.45);
        }
        .picker-logo-text { font-size: 22px; font-weight: 800; color: white; letter-spacing: -0.02em; }
        .picker-logo-sub { color: var(--text-subtle); font-size: 12.5px; margin-top: 2px; }

        .picker-title {
            font-size: 40px;
            font-weight: 800;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff 0%, var(--accent-light) 100%);
            -webkit-background-clip: text; background-clip: text; color: transparent;
            margin-bottom: 12px;
        }
        .picker-sub {
            color: var(--text-muted);
            font-size: 15px;
            margin-bottom: 40px;
        }

        .profiles {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 560px;
            margin: 0 auto;
        }
        .profile-btn {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px 22px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            color: inherit;
            display: block;
        }
        .profile-btn:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 16px 40px rgba(108, 92, 231, 0.3);
        }
        .profile-avatar {
            width: 88px; height: 88px;
            border-radius: 50%;
            margin: 0 auto 16px;
            display: grid; place-items: center;
            color: white;
            font-weight: 800;
            font-size: 36px;
            letter-spacing: -0.02em;
            transition: transform 0.3s;
        }
        .profile-btn:hover .profile-avatar { transform: scale(1.08); }

        .profile-name {
            font-size: 18px;
            font-weight: 700;
            color: white;
            margin-bottom: 6px;
        }
        .profile-theme {
            font-size: 11.5px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-subtle);
            font-weight: 600;
        }
        .profile-theme i { margin-right: 4px; }

        form.profile-form { all: unset; display: block; }
        button.profile-btn {
            border: 1px solid var(--border);
            width: 100%;
            font-family: inherit;
        }

        .picker-footer {
            margin-top: 36px;
            color: var(--text-subtle);
            font-size: 11.5px;
        }
        .picker-footer a { color: var(--accent-light); text-decoration: none; }
    </style>
</head>
<body>
    <div class="picker-wrap">
        <div class="picker-inner">
            <div class="picker-logo">
                <div class="logo">P</div>
                <div style="text-align: left;">
                    <div class="picker-logo-text">PolCRM</div>
                    <div class="picker-logo-sub">{{ _('Hub Agencyjny') }}</div>
                </div>
            </div>

            <h1 class="picker-title">{{ _('Kim jesteś?') }}</h1>
            <p class="picker-sub">{{ _('Wybierz swój profil - pamiętamy wybór przez 90 dni') }}</p>

            <div class="profiles">
                {% for u in users %}
                <form method="POST" action="/choose-profile/{{ u.id }}" class="profile-form">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <button type="submit" class="profile-btn">
                        <div class="profile-avatar" style="background: linear-gradient(135deg, {{ u.avatar_color }}, {{ u.avatar_color }}dd); box-shadow: 0 10px 28px {{ u.avatar_color }}66;">
                            {{ u.initials or u.name[0] }}
                        </div>
                        <div class="profile-name">{{ u.name }}</div>
                        <div class="profile-theme">
                            {% if u.default_theme == 'minimal' %}
                            <i class="bi bi-circle-half"></i>{{ _('motyw minimal') }}
                            {% else %}
                            <i class="bi bi-palette-fill"></i>{{ _('motyw kolorowy') }}
                            {% endif %}
                        </div>
                    </button>
                </form>
                {% endfor %}
            </div>

            <div class="picker-footer">
                {{ _('Tryb demo - wybór profilu bez hasła (AUTH_MODE=profile)') }}
            </div>
        </div>
    </div>
</body>
</html>
