# mypy: kod aplikacji (bez testów i skryptów). Ciała funkcji bez adnotacji też są sprawdzane.
[mypy]
python_version = 3.12
check_untyped_defs = true
warn_unused_ignores = true
# bleach, markdown, requests, waitress i googlemaps nie mają tu stubów; ich API to Any.
ignore_missing_imports = true
exclude = (?x)(^\.venv/|^tests/|^scripts/)
